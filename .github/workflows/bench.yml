name: bench

on:
  workflow_dispatch:
    inputs:
      try:
        description: "お試しで測るフレームワーク名(空白区切り)。空なら本番計測"
        required: false
        default: ""

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: npm run bench
        env:
          TRY: ${{ inputs.try }}
        # $TRY はわざと空白で区切って名前の並びにする。知らない名前は指揮役がはじく。
        run: npm run bench -- ${TRY:+--try $TRY}
      - uses: actions/upload-artifact@v7
        if: inputs.try == ''
        with:
          name: results
          path: results/
