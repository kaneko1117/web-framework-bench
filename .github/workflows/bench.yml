name: bench

on:
  workflow_dispatch:
    inputs:
      try:
        description: "Space-separated framework names for a single unsaved run (empty = full benchmark)"
        required: false
        default: ""

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: npm run bench
        env:
          TRY: ${{ inputs.try }}
        # $TRY is split into names on purpose; the bench rejects unknown names.
        run: npm run bench -- ${TRY:+--try $TRY}
      - uses: actions/upload-artifact@v7
        if: inputs.try == ''
        with:
          name: results
          path: results/
